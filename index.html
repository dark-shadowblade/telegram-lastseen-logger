<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Activity</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#08090d;
    color:#f5f5f5;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    margin:5px 0 25px;
    font-size:28px;
}

.card{
    background:#11131a;
    border:1px solid #242733;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

.label{
    color:#8e93a3;
    font-size:13px;
    margin-bottom:8px;
}

.status{
    font-size:25px;
    font-weight:bold;
    margin-bottom:18px;
}

.online{
    color:#35e27b;
}

.offline{
    color:#aaa;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.stat{
    background:#181b24;
    border-radius:14px;
    padding:15px;
}

.value{
    font-size:20px;
    font-weight:bold;
}

select{
    width:100%;
    padding:14px;
    background:#181b24;
    color:white;
    border:1px solid #303442;
    border-radius:12px;
    font-size:16px;
}

.session{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid #242733;
}

.session:last-child{
    border-bottom:none;
}

.day-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 5px;
    border-bottom:1px solid #242733;
}

.day-row:last-child{
    border-bottom:none;
}

.small{
    color:#9297a6;
    font-size:13px;
    margin-top:5px;
}

.empty{
    color:#888;
    padding:20px 0;
}

.refresh{
    color:#777;
    font-size:12px;
    margin-top:15px;
    text-align:right;
}

@media(max-width:600px){
    .container{
        padding:14px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .session{
        display:block;
    }

    .session b{
        display:block;
        margin-top:7px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Telegram Activity</h1>

<!-- LIVE STATUS -->

<div class="card">

<div class="label">LIVE STATUS</div>

<div id="liveStatus" class="status offline">
Loading...
</div>

<div class="stats">

<div class="stat">
<div class="label">Online Since</div>
<div id="onlineSince" class="value">—</div>
</div>

<div class="stat">
<div class="label">Last Seen</div>
<div id="lastSeen" class="value">—</div>
</div>

</div>

</div>


<!-- TODAY -->

<div class="card">

<div class="label">TODAY'S RECORD</div>

<div class="stats">

<div class="stat">
<div class="label">Total Online</div>
<div id="todayTotal" class="value">0s</div>
</div>

<div class="stat">
<div class="label">Sessions</div>
<div id="todaySessions" class="value">0</div>
</div>

</div>

</div>


<!-- DAY SELECTOR -->

<div class="card">

<div class="label">ACTIVITY HISTORY</div>

<select id="daySelect">
<option value="all">All 7 Days</option>
</select>

</div>


<!-- SUMMARY -->

<div class="card" id="summaryCard">

<div class="label">7-DAY SUMMARY</div>

<div id="summary"></div>

</div>


<!-- DETAILS -->

<div class="card" id="detailsCard">

<div class="label">DAY DETAILS</div>

<div id="details"></div>

</div>


<div class="refresh">
Automatically refreshes every 60 seconds
</div>

</div>


<script>

let data = null;

const DATA_URL = "activity_7days.json";


/* =========================
   TIME HELPERS
========================= */

function pad(n){
    return String(n).padStart(2,"0");
}


function formatDuration(seconds){

    seconds = Math.max(0,Math.floor(seconds));

    const h = Math.floor(seconds / 3600);

    const m = Math.floor((seconds % 3600) / 60);

    const s = seconds % 60;

    if(h > 0){
        return `${h}h ${m}m`;
    }

    if(m > 0){
        return `${m}m ${s}s`;
    }

    return `${s}s`;
}


function formatTime(iso){

    if(!iso){
        return "—";
    }

    const d = new Date(iso);

    return d.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false,
            timeZone:"Asia/Kolkata"
        }
    );
}


function formatDate(iso){

    if(!iso){
        return "—";
    }

    const d = new Date(iso);

    return d.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            timeZone:"Asia/Kolkata"
        }
    );
}


function formatDay(day){

    const d = new Date(day + "T00:00:00+05:30");

    return d.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            timeZone:"Asia/Kolkata"
        }
    );
}


/* =========================
   IST DATE
========================= */

function todayIST(){

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:"Asia/Kolkata",
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    ).format(new Date());

}


/* =========================
   GET LAST 7 DAYS
========================= */

function getLast7Days(){

    const result = [];

    const now = new Date();

    const formatter = new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:"Asia/Kolkata",
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    );

    for(let i=0;i<7;i++){

        const d = new Date(
            now.getTime() - i * 86400000
        );

        result.push(formatter.format(d));

    }

    return result;
}


/* =========================
   SESSIONS FOR DAY
========================= */

function getSessionsForDay(day){

    if(!data || !data.sessions){
        return [];
    }

    return data.sessions.filter(
        session =>
            session.start.substring(0,10) === day
    );

}


/* =========================
   CALCULATE DURATION
========================= */

function calculateTotal(sessions){

    let total = 0;

    sessions.forEach(session => {

        const start = new Date(session.start);

        const end = new Date(session.end);

        total += (end - start) / 1000;

    });

    return total;

}


/* =========================
   LIVE STATUS
========================= */

function renderLive(){

    const online =
        data.current_online_since !== null;

    const statusEl =
        document.getElementById("liveStatus");

    const onlineSince =
        document.getElementById("onlineSince");

    const lastSeen =
        document.getElementById("lastSeen");


    if(online){

        statusEl.textContent = "🟢 ONLINE";

        statusEl.className =
            "status online";

        onlineSince.textContent =
            formatDate(
                data.current_online_since
            )
            + " "
            +
            formatTime(
                data.current_online_since
            );

    }else{

        statusEl.textContent = "⚪ OFFLINE";

        statusEl.className =
            "status offline";

        onlineSince.textContent = "—";

    }


    if(data.sessions && data.sessions.length > 0){

        const latest =
            data.sessions[data.sessions.length - 1];

        lastSeen.textContent =
            formatDate(latest.end)
            + " "
            +
            formatTime(latest.end);

    }else{

        lastSeen.textContent = "—";

    }

}


/* =========================
   TODAY
========================= */

function renderToday(){

    const today = todayIST();

    const sessions =
        getSessionsForDay(today);

    let total =
        calculateTotal(sessions);


    /* Add current online session */

    if(data.current_online_since){

        const start =
            new Date(
                data.current_online_since
            );

        const now =
            new Date();

        total +=
            Math.max(
                0,
                (now - start) / 1000
            );

    }


    document.getElementById(
        "todaySessions"
    ).textContent =
        sessions.length +
        (data.current_online_since ? 1 : 0);


    document.getElementById(
        "todayTotal"
    ).textContent =
        formatDuration(total);

}


/* =========================
   POPULATE DROPDOWN
========================= */

function populateDays(){

    const select =
        document.getElementById("daySelect");


    select.innerHTML =
        '<option value="all">All 7 Days</option>';


    const days =
        getLast7Days();


    days.forEach(day => {

        const option =
            document.createElement("option");

        option.value = day;

        option.textContent =
            formatDay(day);

        select.appendChild(option);

    });

}


/* =========================
   7 DAY SUMMARY
========================= */

function renderSummary(){

    const summary =
        document.getElementById("summary");

    summary.innerHTML = "";


    const days =
        getLast7Days();


    days.forEach(day => {

        const sessions =
            getSessionsForDay(day);

        let total =
            calculateTotal(sessions);


        /* Current online time */

        if(
            data.current_online_since &&
            data.current_online_since.substring(0,10) === day
        ){

            const start =
                new Date(
                    data.current_online_since
                );

            total +=
                Math.max(
                    0,
                    (new Date() - start) / 1000
                );

        }


        const row =
            document.createElement("div");

        row.className =
            "day-row";


        row.innerHTML = `

            <div>

                <b>${formatDay(day)}</b>

                <div class="small">

                    ${sessions.length}
                    completed session${sessions.length !== 1 ? "s" : ""}

                </div>

            </div>

            <b>${formatDuration(total)}</b>

        `;


        summary.appendChild(row);

    });

}


/* =========================
   DAY DETAILS
========================= */

function renderDetails(day){

    const details =
        document.getElementById("details");

    const detailsCard =
        document.getElementById("detailsCard");


    if(day === "all"){

        detailsCard.style.display =
            "none";

        return;

    }


    detailsCard.style.display =
        "block";


    details.innerHTML = "";


    const sessions =
        getSessionsForDay(day);


    if(!sessions.length){

        details.innerHTML =
            '<div class="empty">No recorded activity for this day.</div>';

        return;

    }


    sessions.forEach(session => {

        const start =
            new Date(session.start);

        const end =
            new Date(session.end);

        const duration =
            (end - start) / 1000;


        const div =
            document.createElement("div");

        div.className =
            "session";


        div.innerHTML = `

            <div>

                🟢 ${formatTime(session.start)}
                →
                ${formatTime(session.end)}

            </div>

            <b>${formatDuration(duration)}</b>

        `;


        details.appendChild(div);

    });

}


/* =========================
   LOAD DATA
========================= */

async function loadData(){

    try{

        const response =
            await fetch(
                DATA_URL + "?t=" + Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        data =
            await response.json();


        populateDays();

        renderLive();

        renderToday();

        renderSummary();

        renderDetails(
            document.getElementById(
                "daySelect"
            ).value
        );


    }catch(error){

        console.log(
            "Data loading error:",
            error
        );

    }

}


/* =========================
   DROPDOWN
========================= */

document
.getElementById("daySelect")
.addEventListener(
    "change",
    function(){

        renderDetails(
            this.value
        );

    }
);


/* =========================
   START
========================= */

loadData();


setInterval(
    loadData,
    60000
);

</script>

</body>
</html>
