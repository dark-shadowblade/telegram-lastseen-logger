<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Activity</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #07090d;
    --card: #10141b;
    --card2: #0c1016;
    --border: #202733;
    --text: #f3f5f7;
    --muted: #89919e;
    --accent: #2ea6ff;
    --green: #25e27a;
    --red: #ff4d5a;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #17202c 0%, #07090d 45%);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

.container {
    width: min(1050px, calc(100% - 32px));
    margin: 0 auto;
    padding: 45px 0 60px;
}

/* HEADER */

.header {
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 750;
    letter-spacing: -1.5px;
}

.header p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 14px;
}

/* ERROR */

.error {
    display: none;
    padding: 14px 16px;
    margin-bottom: 20px;
    border-radius: 12px;
    background: rgba(255, 77, 90, 0.1);
    border: 1px solid rgba(255, 77, 90, 0.35);
    color: #ff7c86;
}

/* MAIN STATUS */

.status-card {
    background:
        linear-gradient(135deg, #121821, #0d1117);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.status-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.status-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #777;
    box-shadow: 0 0 0 5px rgba(120,120,120,.08);
}

.status-dot.online {
    background: var(--green);
    box-shadow:
        0 0 0 5px rgba(37,226,122,.10),
        0 0 18px rgba(37,226,122,.55);
}

.status-dot.offline {
    background: var(--red);
    box-shadow: 0 0 0 5px rgba(255,77,90,.08);
}

.status-title {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.status-value {
    margin-top: 4px;
    font-size: 24px;
    font-weight: 750;
}

.status-time {
    text-align: right;
    color: var(--muted);
    font-size: 13px;
}

/* STAT GRID */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 35px;
}

.card {
    background: rgba(16,20,27,.9);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 19px;
    min-height: 105px;
}

.card-label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .7px;
    margin-bottom: 12px;
}

.card-value {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
}

/* SECTIONS */

.section {
    margin-top: 30px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.section h2 {
    margin: 0;
    font-size: 20px;
    letter-spacing: -.3px;
}

/* DAY SELECT */

select {
    width: 100%;
    appearance: none;
    background:
        linear-gradient(45deg, transparent 50%, #aaa 50%) calc(100% - 20px) 50% / 6px 6px no-repeat,
        linear-gradient(135deg, #aaa 50%, transparent 50%) calc(100% - 15px) 50% / 6px 6px no-repeat,
        #10141b;

    color: white;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 15px 45px 15px 16px;
    font-size: 14px;
    outline: none;
    cursor: pointer;
}

select:focus {
    border-color: #36516d;
}

/* 7 DAY SUMMARY */

.summary-list {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
}

.day-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 20px;
    padding: 17px 19px;
    border-bottom: 1px solid #1b212b;
}

.day-row:last-child {
    border-bottom: none;
}

.day-name {
    font-weight: 650;
}

.day-date {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

.day-duration {
    font-weight: 650;
    text-align: right;
}

.day-sessions {
    color: var(--muted);
    font-size: 12px;
    min-width: 70px;
    text-align: right;
}

/* DETAILS */

.details-box {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
}

.details-header {
    padding: 17px 19px;
    border-bottom: 1px solid #1b212b;
    font-weight: 700;
}

.session {
    padding: 18px 19px;
    border-bottom: 1px solid #1b212b;
}

.session:last-child {
    border-bottom: none;
}

.session-time {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 9px;
}

.session-start {
    font-weight: 650;
}

.session-duration {
    color: var(--accent);
    font-weight: 650;
}

.session-end {
    color: var(--muted);
    font-size: 13px;
}

/* EMPTY */

.empty {
    padding: 28px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 40px;
    color: #606975;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 750px) {

    .container {
        width: min(100% - 20px, 600px);
        padding-top: 28px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .status-card {
        align-items: flex-start;
        flex-direction: column;
    }

    .status-time {
        text-align: left;
    }

}

@media (max-width: 480px) {

    .stats {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
    }

    .card {
        padding: 15px;
        min-height: 95px;
    }

    .card-value {
        font-size: 16px;
    }

    .day-row {
        grid-template-columns: 1fr auto;
        gap: 8px;
    }

    .day-sessions {
        grid-column: 2;
        grid-row: 1;
    }

    .day-duration {
        grid-column: 1;
        text-align: left;
        color: var(--accent);
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Telegram Activity</h1>
        <p>Activity monitoring dashboard</p>
    </div>

    <div id="error" class="error"></div>

    <!-- CURRENT STATUS -->

    <div class="status-card">

        <div class="status-left">

            <div id="statusDot" class="status-dot"></div>

            <div>
                <div class="status-title">Current Status</div>
                <div id="status" class="status-value">
                    Loading...
                </div>
            </div>

        </div>

        <div id="updatedAt" class="status-time">
            Updating...
        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="card">
            <div class="card-label">Online Since</div>
            <div id="onlineSince" class="card-value">—</div>
        </div>

        <div class="card">
            <div class="card-label">Last Seen</div>
            <div id="lastSeen" class="card-value">—</div>
        </div>

        <div class="card">
            <div class="card-label">Today Online</div>
            <div id="todayTotal" class="card-value">0s</div>
        </div>

        <div class="card">
            <div class="card-label">Sessions</div>
            <div id="sessionCount" class="card-value">0</div>
        </div>

    </div>


    <!-- ACTIVITY HISTORY -->

    <div class="section">

        <div class="section-header">
            <h2>Activity History</h2>
        </div>

        <select id="daySelect">
            <option value="all">All 7 Days</option>
        </select>

    </div>


    <!-- SUMMARY -->

    <div class="section">

        <div id="summary" class="summary-list"></div>

    </div>


    <!-- DETAILS -->

    <div class="section">

        <div class="section-header">
            <h2>Day Details</h2>
        </div>

        <div id="details" class="details-box"></div>

    </div>


    <div class="footer">
        Automatically refreshes every 60 seconds
    </div>

</div>


<script>

const DATA_URL =
"https://cdn.jsdelivr.net/gh/dark-shadowblade/telegram-activity-data@main/activity_7days.json";

const TIMEZONE = "Asia/Kolkata";

let data = null;
let selectedDay = "all";


function $(id) {
    return document.getElementById(id);
}


function formatDateTime(iso) {

    if (!iso) return "—";

    return new Intl.DateTimeFormat("en-IN", {
        timeZone: TIMEZONE,
        dateStyle: "medium",
        timeStyle: "short"
    }).format(new Date(iso));

}


function formatShortDate(day) {

    const d = new Date(day + "T00:00:00");

    return new Intl.DateTimeFormat("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    }).format(d);

}


function getDayKey(date) {

    return new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE
    }).format(date);

}


function getLast7Days() {

    const result = [];

    const now = new Date();

    for (let i = 0; i < 7; i++) {

        const d = new Date(now);

        d.setDate(d.getDate() - i);

        result.push(getDayKey(d));

    }

    return result;

}


function formatDuration(seconds) {

    seconds = Math.max(0, Math.floor(seconds));

    const days = Math.floor(seconds / 86400);
    seconds %= 86400;

    const hours = Math.floor(seconds / 3600);
    seconds %= 3600;

    const minutes = Math.floor(seconds / 60);
    seconds %= 60;

    const parts = [];

    if (days) parts.push(days + "d");
    if (hours) parts.push(hours + "h");
    if (minutes) parts.push(minutes + "m");

    if (!parts.length || seconds) {
        parts.push(seconds + "s");
    }

    return parts.join(" ");
}


function sessionDuration(session) {

    const start = new Date(session.start);

    const end = session.end
        ? new Date(session.end)
        : new Date();

    return Math.max(
        0,
        (end - start) / 1000
    );

}


function getTodayTotal() {

    if (!data) return 0;

    const today = getDayKey(new Date());

    let total = 0;

    for (const session of data.sessions || []) {

        if (
            getDayKey(
                new Date(session.start)
            ) === today
        ) {

            total += sessionDuration(session);

        }

    }

    if (data.current_online_since) {

        if (
            getDayKey(
                new Date(data.current_online_since)
            ) === today
        ) {

            total +=
                (Date.now() -
                new Date(
                    data.current_online_since
                ).getTime()) / 1000;

        }

    }

    return total;

}


function populateDays() {

    const select = $("daySelect");

    select.innerHTML =
        '<option value="all">All 7 Days</option>';

    getLast7Days().forEach(day => {

        const option =
            document.createElement("option");

        option.value = day;

        option.textContent =
            formatShortDate(day);

        select.appendChild(option);

    });

}


function renderTop() {

    if (!data) return;

    const status =
        data.last_status ||
        (data.current_online_since
            ? "ONLINE"
            : "OFFLINE");

    $("status").textContent = status;

    const dot = $("statusDot");

    dot.className = "status-dot";

    if (status === "ONLINE") {

        dot.classList.add("online");

    } else {

        dot.classList.add("offline");

    }


    $("onlineSince").textContent =
        data.current_online_since
            ? formatDateTime(
                data.current_online_since
              )
            : "—";


    $("lastSeen").textContent =
        data.last_seen
            ? formatDateTime(data.last_seen)
            : "—";


    $("todayTotal").textContent =
        formatDuration(
            getTodayTotal()
        );


    $("sessionCount").textContent =
        (data.sessions || []).length;


    $("updatedAt").textContent =
        data.updated_at
            ? "Updated " +
              formatDateTime(data.updated_at)
            : "Waiting for update";

}


function getDayStats(day) {

    let total = 0;
    let count = 0;

    for (const session of data.sessions || []) {

        if (
            getDayKey(
                new Date(session.start)
            ) === day
        ) {

            total += sessionDuration(session);
            count++;

        }

    }

    return {
        total,
        count
    };

}


function renderSummary() {

    const container = $("summary");

    container.innerHTML = "";

    getLast7Days().forEach(day => {

        const stats =
            getDayStats(day);

        const row =
            document.createElement("div");

        row.className = "day-row";

        row.innerHTML = `
            <div>
                <div class="day-name">
                    ${day}
                </div>
                <div class="day-date">
                    ${formatShortDate(day)}
                </div>
            </div>

            <div class="day-duration">
                ${formatDuration(stats.total)}
            </div>

            <div class="day-sessions">
                ${stats.count}
                ${stats.count === 1 ? "session" : "sessions"}
            </div>
        `;

        container.appendChild(row);

    });

}


function renderDetails() {

    const container = $("details");

    container.innerHTML = "";

    let sessions =
        data.sessions || [];


    if (selectedDay !== "all") {

        sessions = sessions.filter(
            session =>
                getDayKey(
                    new Date(session.start)
                ) === selectedDay
        );

    }


    const title =
        selectedDay === "all"
            ? "All recorded sessions"
            : formatShortDate(selectedDay);


    const header =
        document.createElement("div");

    header.className =
        "details-header";

    header.textContent = title;

    container.appendChild(header);


    if (!sessions.length) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            selectedDay === "all"
                ? "No recorded sessions yet."
                : "No sessions recorded on this day.";

        container.appendChild(empty);

        return;

    }


    sessions
        .slice()
        .reverse()
        .forEach(session => {

            const div =
                document.createElement("div");

            div.className = "session";

            div.innerHTML = `

                <div class="session-time">

                    <div class="session-start">
                        ${formatDateTime(session.start)}
                    </div>

                    <div class="session-duration">
                        ${formatDuration(
                            sessionDuration(session)
                        )}
                    </div>

                </div>

                <div class="session-end">
                    End:
                    ${
                        session.end
                            ? formatDateTime(session.end)
                            : "Currently online"
                    }
                </div>

            `;

            container.appendChild(div);

        });

}


function render() {

    if (!data) return;

    renderTop();
    renderSummary();
    renderDetails();

}


async function loadData() {

    try {

        const response =
            await fetch(
                DATA_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }

        data =
            await response.json();

        $("error").style.display =
            "none";

        render();

    }
    catch (error) {

        console.error(error);

        $("error").style.display =
            "block";

        $("error").textContent =
            "Unable to load activity data: " +
            error.message;

        $("status").textContent =
            "Data Error";

    }

}


$("daySelect").addEventListener(
    "change",
    function () {

        selectedDay =
            this.value;

        renderDetails();

    }
);


populateDays();

loadData();

setInterval(
    loadData,
    60000
);

setInterval(
    () => {

        if (data) {
            renderTop();
        }

    },
    1000
);

</script>

</body>
</html>
