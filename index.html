<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Activity</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    margin-bottom: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.card {
    background: #111;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 18px;
}

.label {
    color: #888;
    font-size: 13px;
    margin-bottom: 8px;
}

.value {
    font-size: 20px;
    font-weight: bold;
}

.online {
    color: #00ff66;
}

.offline {
    color: #ff4444;
}

select {
    width: 100%;
    padding: 12px;
    margin: 20px 0;
    background: #111;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
}

.section {
    margin-top: 20px;
}

.day {
    background: #111;
    border: 1px solid #333;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.session {
    padding: 10px 0;
    border-bottom: 1px solid #222;
}

.error {
    background: #300;
    border: 1px solid #900;
    padding: 12px;
    border-radius: 8px;
    display: none;
    margin-bottom: 15px;
}

.muted {
    color: #888;
}
</style>
</head>

<body>

<div class="container">

<h1>Telegram Activity</h1>

<div id="error" class="error"></div>

<div class="cards">

    <div class="card">
        <div class="label">Live Status</div>
        <div id="status" class="value">Loading...</div>
    </div>

    <div class="card">
        <div class="label">Online Since</div>
        <div id="onlineSince" class="value">—</div>
    </div>

    <div class="card">
        <div class="label">Last Seen</div>
        <div id="lastSeen" class="value">—</div>
    </div>

    <div class="card">
        <div class="label">Today Total Online</div>
        <div id="todayTotal" class="value">0s</div>
    </div>

    <div class="card">
        <div class="label">Sessions</div>
        <div id="sessionCount" class="value">0</div>
    </div>

</div>

<div class="section">

<h2>Activity History</h2>

<select id="daySelect">
    <option value="all">All 7 Days</option>
</select>

<div id="summary"></div>

</div>

<div class="section">

<h2>Day Details</h2>

<div id="details"></div>

</div>

<p class="muted">
Automatically refreshes every 60 seconds
</p>

</div>

<script>

const DATA_URL =
"https://raw.githubusercontent.com/dark-shadowblade/telegram-activity-data/main/activity_7days.json";

const TIMEZONE = "Asia/Kolkata";

let data = null;
let selectedDay = "all";


function $(id) {
    return document.getElementById(id);
}


function formatDateTime(iso) {

    if (!iso) return "—";

    return new Intl.DateTimeFormat("en-IN", {
        timeZone: TIMEZONE,
        dateStyle: "medium",
        timeStyle: "short"
    }).format(new Date(iso));

}


function getDayKey(date) {

    return new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE
    }).format(date);

}


function formatDuration(seconds) {

    seconds = Math.max(0, Math.floor(seconds));

    const days = Math.floor(seconds / 86400);
    seconds %= 86400;

    const hours = Math.floor(seconds / 3600);
    seconds %= 3600;

    const minutes = Math.floor(seconds / 60);
    seconds %= 60;

    let result = [];

    if (days) result.push(days + "d");
    if (hours) result.push(hours + "h");
    if (minutes) result.push(minutes + "m");

    result.push(seconds + "s");

    return result.join(" ");
}


function getLast7Days() {

    const result = [];

    const now = new Date();

    for (let i = 0; i < 7; i++) {

        const d = new Date(now);

        d.setDate(d.getDate() - i);

        result.push(getDayKey(d));

    }

    return result;

}


function populateDays() {

    const select = $("daySelect");

    select.innerHTML =
        '<option value="all">All 7 Days</option>';

    getLast7Days().forEach(day => {

        const option = document.createElement("option");

        option.value = day;
        option.textContent = day;

        select.appendChild(option);

    });

}


function sessionDuration(session) {

    const start = new Date(session.start);

    const end = session.end
        ? new Date(session.end)
        : new Date();

    return Math.max(
        0,
        (end - start) / 1000
    );

}


function getTodayTotal() {

    if (!data) return 0;

    const today = getDayKey(new Date());

    let total = 0;

    for (const session of data.sessions || []) {

        if (getDayKey(new Date(session.start)) === today) {

            total += sessionDuration(session);

        }

    }

    if (data.current_online_since) {

        if (
            getDayKey(
                new Date(data.current_online_since)
            ) === today
        ) {

            total +=
                (Date.now() -
                new Date(data.current_online_since).getTime())
                / 1000;

        }

    }

    return total;

}


function renderTop() {

    const status =
        data.last_status ||
        (data.current_online_since
            ? "ONLINE"
            : "OFFLINE");

    const statusElement = $("status");

    statusElement.textContent = status;

    statusElement.className = "value";

    if (status === "ONLINE") {

        statusElement.classList.add("online");

    } else {

        statusElement.classList.add("offline");

    }


    $("onlineSince").textContent =
        data.current_online_since
            ? formatDateTime(data.current_online_since)
            : "—";


    $("lastSeen").textContent =
        data.last_seen
            ? formatDateTime(data.last_seen)
            : "—";


    $("todayTotal").textContent =
        formatDuration(getTodayTotal());


    $("sessionCount").textContent =
        (data.sessions || []).length;

}


function renderSummary() {

    const container = $("summary");

    container.innerHTML = "";

    const days = getLast7Days();

    days.forEach(day => {

        let total = 0;
        let count = 0;

        for (const session of data.sessions || []) {

            if (
                getDayKey(
                    new Date(session.start)
                ) === day
            ) {

                total += sessionDuration(session);
                count++;

            }

        }

        const div = document.createElement("div");

        div.className = "day";

        div.innerHTML = `
            <strong>${day}</strong>
            <br>
            Online: ${formatDuration(total)}
            <br>
            Sessions: ${count}
        `;

        container.appendChild(div);

    });

}


function renderDetails() {

    const container = $("details");

    container.innerHTML = "";

    let sessions = data.sessions || [];

    if (selectedDay !== "all") {

        sessions = sessions.filter(session =>

            getDayKey(
                new Date(session.start)
            ) === selectedDay

        );

    }


    if (!sessions.length) {

        container.innerHTML =
            '<div class="muted">No recorded sessions.</div>';

        return;

    }


    sessions
        .slice()
        .reverse()
        .forEach(session => {

            const div =
                document.createElement("div");

            div.className = "day";

            div.innerHTML = `
                <div class="session">
                    <strong>
                        ${formatDateTime(session.start)}
                    </strong>
                    <br>
                    End:
                    ${
                        session.end
                        ? formatDateTime(session.end)
                        : "Currently online"
                    }
                    <br>
                    Duration:
                    ${formatDuration(sessionDuration(session))}
                </div>
            `;

            container.appendChild(div);

        });

}


function render() {

    if (!data) return;

    renderTop();
    renderSummary();
    renderDetails();

}


async function loadData() {

    try {

        const url =
            DATA_URL +
            "?t=" +
            Date.now();

        const response =
            await fetch(url, {
                cache: "no-store"
            });

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }

        data = await response.json();

        $("error").style.display = "none";

        render();

    }
    catch (error) {

        console.error(error);

        $("error").style.display = "block";

        $("error").textContent =
            "Unable to load activity data: " +
            error.message;

        $("status").textContent =
            "Data Error";

    }

}


$("daySelect").addEventListener(
    "change",
    function () {

        selectedDay = this.value;

        renderDetails();

    }
);


populateDays();

loadData();

setInterval(loadData, 60000);

setInterval(() => {

    if (data) {

        renderTop();

    }

}, 1000);

</script>

</body>
</html>
